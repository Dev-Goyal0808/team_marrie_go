name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm workspace dependencies
        run: npm install --ignore-scripts

      - name: Check JavaScript syntax and JSON
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate contract build
        run: npm run build

      - name: Run API health smoke test
        run: npm run check:health
